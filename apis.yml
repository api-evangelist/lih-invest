aid: lih-invest
name: LIH Healthcare (长和医疗)
description: 'Beijing Changhe International Medical Investment Management Co., Ltd. — operating as LIH
  Healthcare (长和医疗) — is a Chinese rehabilitation-medicine group that invests in, manages, and operates
  rehabilitation hospitals and outpatient clinics. The company imports international rehabilitation techniques,
  service models, and management practices and adapts them to the Chinese market across pediatric developmental
  and behavioral rehabilitation, cardiopulmonary and critical-care rehabilitation, pain rehabilitation,
  neurological rehabilitation, and bone and joint rehabilitation. Its three business models are building
  and investing in high-standard rehabilitation hospitals and clinics, co-operating rehabilitation-medicine
  departments inside existing general hospitals, and selling systematized rehabilitation service solutions
  (planning, clinical pathways, operations, equipment, IT consulting, and staff training) to hospitals.
  Facilities include Beijing Changhe Dayun Pediatric Clinic, Shanghai and Shenzhen pediatric rehabilitation
  outpatient centers, and Kunming Changhe Tiancheng Rehabilitation Hospital. It is a portfolio company
  of Qiming Venture Partners. LIH Healthcare publishes no public developer program, API, or SDK — this
  profile carries identity and domain-security data only.'
